[package]
name = "vetf_net"
description = "Network protocol (lightyear): replicated components, inputs, messages, channels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vetf_sim.workspace = true
bevy = { workspace = true, default-features = false, features = ["std", "bevy_state", "serialize"] }
lightyear.workspace = true
serde.workspace = true

[dev-dependencies]
ron.workspace = true
# lightyear's message and component serializer (via lightyear_serde): the protocol tests round-trip through it.
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
