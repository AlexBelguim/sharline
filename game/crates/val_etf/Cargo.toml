[package]
name = "val_etf"
description = "The game: host-and-join listen server, gun range and team deathmatch."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
vetf_sim.workspace = true
vetf_net.workspace = true
bevy = { workspace = true, features = ["default", "jpeg", "system_clipboard"] }
lightyear.workspace = true
serde.workspace = true
ron.workspace = true
iroh = "1.3"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
